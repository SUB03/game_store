name: Tests

on:
  # run the suite (and deploy) only on pushes to master
  push:
    branches: [master]
  # allow manual runs from the Actions tab
  workflow_dispatch:

jobs:
  tests:
    # GitHub-hosted runner; has a Docker daemon for the integration fixtures
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.14" # matches the local .venv
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Unit tests
        run: pytest tests/unit -q

      # starts a throwaway postgres:18 container on 127.0.0.1:5433,
      # applies the alembic migrations of all four services, then removes it;
      # --cov-append merges the unit-test data so coverage.xml covers both suites
      - name: Integration tests
        run: pytest tests/integration -q --cov-append

  deploy:
    # only starts after the test job succeeded
    needs: tests
    # self-hosted runner registered with the label "laptop"
    runs-on: [self-hosted, laptop]
    steps:
      - uses: actions/checkout@v5

      # datasets/ is gitignored too, so restore it from the runner's
      # persistent copy — the first store migration loads it into the db
      - name: Restore dataset
        run: cp -rT ~/datasets/game_store_dataset ./datasets

      # .env is gitignored and checkout wipes untracked files every run,
      # so recreate it from the DEPLOY_ENV repository secret
      - name: Create .env
        env:
          DEPLOY_ENV: ${{ secrets.DEPLOY_ENV }}
        run: echo "$DEPLOY_ENV" > .env

      - name: Start PostgreSQL
        run: docker compose -f docker-compose.yaml -f docker-compose.prod.yaml up -d postgres

      - name: Wait for PostgreSQL
        run: |
          for i in $(seq 1 30); do
            if docker compose -f docker-compose.yaml -f docker-compose.prod.yaml exec -T postgres pg_isready -U postgres -q; then
              echo "postgres is ready"
              exit 0
            fi
            sleep 2
          done
          echo "postgres did not become ready in time" >&2
          exit 1

      - name: Run database migrations
        run: |
          docker compose -f docker-compose.yaml -f docker-compose.prod.yaml run --rm auth_service alembic -c auth_service/alembic.ini upgrade head
          docker compose -f docker-compose.yaml -f docker-compose.prod.yaml run --rm store_service alembic -c store_service/alembic.ini upgrade head
          docker compose -f docker-compose.yaml -f docker-compose.prod.yaml run --rm users_service alembic -c users_service/alembic.ini upgrade head
          docker compose -f docker-compose.yaml -f docker-compose.prod.yaml run --rm payment_service alembic -c payment_service/alembic.ini upgrade head

      - name: Deploy the stack
        run: docker compose -f docker-compose.yaml -f docker-compose.prod.yaml up -d --build
