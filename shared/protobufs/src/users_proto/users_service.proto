syntax = "proto3";

package users.v1;

message AddGameToUserRequest {
  string username = 1;
  int64 appid = 2;
}

message AddGameToUserResponse {
  int64 appid = 1;
}

// Batch variant used by the saga grant consumer: insert every appid only if
// the user owns none of them; if the user owns some (but not all) of them,
// insert nothing so money is never taken for a partially-owned bundle.
message AddGamesIfNoneOwnedRequest {
  string username = 1;
  repeated int64 appids = 2;
}

message AddGamesIfNoneOwnedResponse {
  repeated int64 already_owned = 1;
}

message HasGameRequest {
  string username = 1;
  int64 appid = 2;
}

message HasGameResponse {
  bool result = 1;
}

message GetOwnedGamesRequest {
  string username = 1;
}

message GetOwnedGamesResponse {
  repeated int64 appids = 1;
}

message AddGameToCartRequest {
  string username = 1;
  int64 appid = 2;
}

message AddGameToCartResponse {
  int64 appid = 1;
  bool added = 2;
}

message RemoveGameFromCartRequest {
  string username = 1;
  int64 appid = 2;
}

message RemoveGameFromCartResponse {
  int64 appid = 1;
  bool removed = 2;
}

message GetCartRequest {
  string username = 1;
}

message GetCartResponse {
  repeated int64 appids = 1;
}

message ClearCartRequest {
  string username = 1;
}

message ClearCartResponse {
  int32 removed = 1;
}

service UserService {
  rpc HasGame(HasGameRequest) returns (HasGameResponse);
  rpc AddGameToUser(AddGameToUserRequest) returns (AddGameToUserResponse);
  rpc AddGamesIfNoneOwned(AddGamesIfNoneOwnedRequest) returns (AddGamesIfNoneOwnedResponse);
  rpc GetOwnedGames(GetOwnedGamesRequest) returns (GetOwnedGamesResponse);
  rpc AddGameToCart(AddGameToCartRequest) returns (AddGameToCartResponse);
  rpc RemoveGameFromCart(RemoveGameFromCartRequest) returns (RemoveGameFromCartResponse);
  rpc GetCart(GetCartRequest) returns (GetCartResponse);
  rpc ClearCart(ClearCartRequest) returns (ClearCartResponse);
}

